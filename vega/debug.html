<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Debug Vega-Lite</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px;
            line-height: 1.6;
        }
        .status { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>Vega-Lite Debug Test</h1>
    
    <div id="status"></div>
    <div id="vis"></div>
    
    <script>
        function logStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            document.getElementById('status').appendChild(div);
            console.log(message);
        }
        
        logStatus('Starting debug test...');
        
        // Test 1: Check if we can load scripts
        function loadScript(src, name) {
            return new Promise((resolve, reject) => {
                logStatus(`Loading ${name}...`);
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    logStatus(`✅ ${name} loaded successfully`, 'success');
                    resolve();
                };
                script.onerror = () => {
                    logStatus(`❌ Failed to load ${name}`, 'error');
                    reject(new Error(`Failed to load ${name}`));
                };
                document.head.appendChild(script);
            });
        }
        
        // Load Vega stack sequentially
        loadScript('https://cdn.jsdelivr.net/npm/vega@5', 'Vega')
            .then(() => loadScript('https://cdn.jsdelivr.net/npm/vega-lite@5', 'Vega-Lite'))
            .then(() => loadScript('https://cdn.jsdelivr.net/npm/vega-embed@6', 'Vega-Embed'))
            .then(() => {
                logStatus('All libraries loaded, testing chart...', 'success');
                
                // Test 2: Check if vegaEmbed is available
                if (typeof vegaEmbed === 'undefined') {
                    throw new Error('vegaEmbed is not defined');
                }
                
                // Test 3: Create simple chart
                const spec = {
                    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
                    "data": {"values": [{"x": "A", "y": 10}, {"x": "B", "y": 20}]},
                    "mark": "bar",
                    "encoding": {
                        "x": {"field": "x", "type": "nominal"},
                        "y": {"field": "y", "type": "quantitative"}
                    }
                };
                
                return vegaEmbed('#vis', spec);
            })
            .then(() => {
                logStatus('✅ Chart rendered successfully!', 'success');
            })
            .catch(error => {
                logStatus(`❌ Error: ${error.message}`, 'error');
                console.error('Full error:', error);
            });
    </script>
</body>
</html>
